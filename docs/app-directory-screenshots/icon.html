<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solva HR Icon</title>
    <style>
      html, body {
        margin: 0;
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      .icon {
        width: 512px;
        height: 512px;
        background:
          radial-gradient(circle at 30% 20%, rgba(255,255,255,0.22), transparent 25%),
          linear-gradient(135deg, #2563eb 0%, #0f172a 100%);
        display: grid;
        place-items: center;
      }

      .mark {
        color: #ffffff;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-size: 268px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.08em;
        transform: translateX(-8px);
        text-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="mark">S</div>
    </div>
  </body>
</html>
